
name: Compilar Cuadernillos PDF para Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.16.0

      - name: Crear ejecutable
        run: >
          pyinstaller --noconfirm --clean --onefile
          --windowed
          --name CuadernillosPDF
          --version-file version_info.txt
          cuadernillos.py

      - name: Preparar distribucion
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path paquete
          Copy-Item dist/CuadernillosPDF.exe paquete/
          Copy-Item LICENSE paquete/
          Copy-Item README.md paquete/
          Copy-Item requirements.txt paquete/
          Copy-Item THIRD_PARTY_NOTICES.md paquete/
          Compress-Archive -Path paquete/* -DestinationPath CuadernillosPDF-Windows.zip

      - name: Publicar artefacto de prueba
        uses: actions/upload-artifact@v4
        with:
          name: CuadernillosPDF-Windows
          path: CuadernillosPDF-Windows.zip

      - name: Adjuntar paquete a GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title $env:RELEASE_TAG --generate-notes
          }
          gh release upload $env:RELEASE_TAG CuadernillosPDF-Windows.zip --clobber
