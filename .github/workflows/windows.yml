
name: Compilar Cuadernillos PDF para Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.16.0

      - name: Crear ejecutable
        run: >
          pyinstaller --noconfirm --clean --onefile
          --windowed
          --name CuadernillosPDF
          --version-file version_info.txt
          cuadernillos.py

      - name: Preparar distribucion
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path paquete
          Copy-Item dist/CuadernillosPDF.exe paquete/
          Copy-Item LICENSE paquete/
          Copy-Item README.md paquete/
          Copy-Item requirements.txt paquete/

      - name: Publicar paquete descargable
        uses: actions/upload-artifact@v4
        with:
          name: CuadernillosPDF-Windows-v1.0.1
          path: paquete/
